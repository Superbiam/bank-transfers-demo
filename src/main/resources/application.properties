spring.application.name=bank-transfers-demo
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
spring.datasource.username=${DB_USER:bank}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.pan.encryption-key=${PAN_ENCRYPTION_KEY}
app.pan.hmac-key=${PAN_HMAC_KEY}